name: Build Windows EXE

on:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Run automated tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build self-contained Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PX4_Pix4D_Tagger --collect-all pyulog px4_pix4d_gui.py

      - name: Package student download
        shell: pwsh
        run: |
          Copy-Item course_config.json dist\course_config.json
          Compress-Archive -Path dist\PX4_Pix4D_Tagger.exe, dist\course_config.json -DestinationPath dist\PX4_Pix4D_Tagger_Windows.zip -Force

      - name: Upload tested build
        uses: actions/upload-artifact@v4
        with:
          name: PX4_Pix4D_Tagger_Windows
          path: |
            dist/PX4_Pix4D_Tagger.exe
            dist/course_config.json
            dist/PX4_Pix4D_Tagger_Windows.zip
          if-no-files-found: error

  publish-versioned-release:
    if: startsWith(github.ref, 'refs/heads/release/v') || startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested Windows build
        uses: actions/download-artifact@v4
        with:
          name: PX4_Pix4D_Tagger_Windows
          path: release-files

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME#release/}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must look like v0.3.0" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${RELEASE_VERSION}"             "release-files/PX4_Pix4D_Tagger.exe"             "release-files/PX4_Pix4D_Tagger_Windows.zip"             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "PX4 Pix4D JPEG Tagger ${RELEASE_VERSION}"             --generate-notes             --latest
